<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procédures — Altinkaya Romain</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@800&family=Outfit:wght@300;400;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/particles.js"></script>

    <style>
        /* ── Catégories ── */
        .cat-filters {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 28px;
        }
        .cat-btn {
            padding: 6px 16px;
            border-radius: 100px;
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.02);
            color: var(--text-dim);
            font-family: var(--font-mono);
            font-size: 0.68rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .cat-btn:hover, .cat-btn.active {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(0,229,176,0.07);
        }

        /* ── Grille de procédures ── */
        .proc-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 16px;
        }

        .proc-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .proc-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.06), transparent);
        }
        .proc-card:hover {
            border-color: rgba(0,229,176,0.3);
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.5);
        }

        .proc-header {
            display: flex;
            align-items: flex-start;
            gap: 14px;
        }
        .proc-icon {
            width: 44px; height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
        }
        .proc-icon.pdf  { background: rgba(239,68,68,0.1);  border: 1px solid rgba(239,68,68,0.2);  color: #ef4444; }
        .proc-icon.docx { background: rgba(59,130,246,0.1); border: 1px solid rgba(59,130,246,0.2); color: #3b82f6; }

        .proc-meta { flex: 1; min-width: 0; }
        .proc-title {
            font-family: var(--font-head);
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .proc-info {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        .proc-cat {
            font-family: var(--font-mono);
            font-size: 0.6rem;
            padding: 2px 8px;
            border-radius: 4px;
            background: rgba(0,229,176,0.07);
            border: 1px solid rgba(0,229,176,0.2);
            color: var(--accent);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .proc-date {
            font-family: var(--font-mono);
            font-size: 0.6rem;
            color: var(--text-muted);
        }
        .proc-size {
            font-family: var(--font-mono);
            font-size: 0.6rem;
            color: var(--text-muted);
        }

        .proc-desc {
            font-size: 0.82rem;
            color: var(--text-dim);
            line-height: 1.6;
            flex: 1;
        }

        .proc-actions {
            display: flex;
            gap: 8px;
            margin-top: 4px;
        }
        .proc-btn {
            flex: 1;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.02);
            color: var(--text-dim);
            font-family: var(--font-mono);
            font-size: 0.65rem;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .proc-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(0,229,176,0.05);
        }
        .proc-btn.primary {
            border-color: rgba(0,229,176,0.3);
            color: var(--accent);
            background: rgba(0,229,176,0.05);
        }
        .proc-btn.primary:hover {
            background: var(--accent);
            color: #000;
        }

        /* ── Stats ── */
        .stats-proc {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 28px;
        }
        .stat-proc-box {
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px;
            text-align: center;
        }
        .stat-proc-box .num {
            font-family: var(--font-head);
            font-size: 1.5rem;
            background: linear-gradient(135deg, #00e5b0, #00c8ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: block;
            margin-bottom: 4px;
        }
        .stat-proc-box .lbl {
            font-family: var(--font-mono);
            font-size: 0.6rem;
            color: var(--text-dim);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* ── Empty state ── */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-dim);
        }
        .empty-state i {
            font-size: 3rem;
            color: rgba(0,229,176,0.2);
            margin-bottom: 16px;
            display: block;
        }
        .empty-state p {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            letter-spacing: 1px;
        }

        /* ── Search ── */
        .search-bar {
            position: relative;
            margin-bottom: 20px;
        }
        .search-bar input {
            width: 100%;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 16px 12px 44px;
            color: var(--text);
            font-family: var(--font-body);
            font-size: 0.88rem;
            transition: border-color 0.2s;
            box-sizing: border-box;
        }
        .search-bar input:focus {
            outline: none;
            border-color: var(--accent);
        }
        .search-bar i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-dim);
            font-size: 0.85rem;
        }

        @media (max-width: 700px) {
            .stats-proc { grid-template-columns: repeat(2,1fr); }
            .proc-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div id="particles-js"></div>
    <div id="header-placeholder"></div>

    <main class="container">
        <header class="hero">
            <h1>Procédures</h1>
            <p class="terminal-text">_TSSR_PROCEDURES_&_GUIDES</p>
        </header>

        <!-- ── STATS ── -->
        <div class="stats-proc">
            <div class="stat-proc-box"><span class="num" id="stat-total">0</span><span class="lbl">Procédures</span></div>
            <div class="stat-proc-box"><span class="num" id="stat-pdf">0</span><span class="lbl">PDF</span></div>
            <div class="stat-proc-box"><span class="num" id="stat-docx">0</span><span class="lbl">DOCX</span></div>
            <div class="stat-proc-box"><span class="num" id="stat-cats">0</span><span class="lbl">Catégories</span></div>
        </div>

        <!-- ── RECHERCHE + FILTRES ── -->
        <div class="search-bar">
            <i class="fas fa-search"></i>
            <input type="text" id="search-input" placeholder="Rechercher une procédure...">
        </div>

        <div class="cat-filters" id="cat-filters">
            <button class="cat-btn active" data-cat="all">Toutes</button>
        </div>

        <!-- ── GRILLE ── -->
        <div class="proc-grid" id="proc-grid">
            <div class="empty-state" id="empty-state">
                <i class="fas fa-folder-open"></i>
                <p>Chargement des procédures...</p>
            </div>
        </div>

    </main>

    <footer><p>© 2026 — Altinkaya Romain | Procédures TSSR</p></footer>
    <button id="backToTop"><i class="fas fa-arrow-up"></i></button>
    <script src="assets/js/script.js"></script>

    <script>
    // ══════════════════════════════════════════
    //  ÉTAT & VARIABLES
    // ══════════════════════════════════════════
    let procedures = [];
    let currentFilter = 'all';
    let searchQuery = '';

    // ══════════════════════════════════════════
    //  INIT
    // ══════════════════════════════════════════
    document.addEventListener('DOMContentLoaded', () => {
        loadProcedures();
        initSearch();
    });

    // ══════════════════════════════════════════
    //  CHARGER LES PROCÉDURES DEPUIS JSON
    // ══════════════════════════════════════════
    function loadProcedures() {
        fetch('procedures/index.json')
            .then(response => {
                if (!response.ok) throw new Error('Erreur de chargement');
                return response.json();
            })
            .then(data => {
                procedures = data;
                renderAll();
            })
            .catch(error => {
                console.error('Erreur:', error);
                document.getElementById('empty-state').innerHTML = `
                    <i class="fas fa-exclamation-circle"></i>
                    <p>Erreur de chargement des procédures.<br>Vérifiez que procedures/index.json existe.</p>
                `;
            });
    }

    // ══════════════════════════════════════════
    //  RECHERCHE
    // ══════════════════════════════════════════
    function initSearch() {
        document.getElementById('search-input').addEventListener('input', e => {
            searchQuery = e.target.value.toLowerCase();
            renderCards();
        });
    }

    // ══════════════════════════════════════════
    //  RENDU
    // ══════════════════════════════════════════
    function renderAll() {
        renderStats();
        renderFilters();
        renderCards();
    }

    function renderStats() {
        const pdfs  = procedures.filter(p => p.filename.toLowerCase().endsWith('.pdf')).length;
        const docxs = procedures.filter(p => p.filename.toLowerCase().endsWith('.docx') || p.filename.toLowerCase().endsWith('.doc')).length;
        const cats  = new Set(procedures.map(p => p.category)).size;
        document.getElementById('stat-total').textContent = procedures.length;
        document.getElementById('stat-pdf').textContent   = pdfs;
        document.getElementById('stat-docx').textContent  = docxs;
        document.getElementById('stat-cats').textContent  = cats;
    }

    function renderFilters() {
        const cats = ['all', ...new Set(procedures.map(p => p.category))];
        const container = document.getElementById('cat-filters');
        container.innerHTML = cats.map(cat => `
            <button class="cat-btn ${currentFilter === cat ? 'active' : ''}"
                    data-cat="${cat}"
                    onclick="setFilter('${cat}')">
                ${cat === 'all' ? 'Toutes' : cat}
                ${cat !== 'all' ? `<span style="opacity:.5;margin-left:4px;">${procedures.filter(p=>p.category===cat).length}</span>` : ''}
            </button>
        `).join('');
    }

    function setFilter(cat) {
        currentFilter = cat;
        renderFilters();
        renderCards();
    }

    function renderCards() {
        const grid  = document.getElementById('proc-grid');
        const empty = document.getElementById('empty-state');

        let filtered = procedures.filter(p => {
            const catOk  = currentFilter === 'all' || p.category === currentFilter;
            const searchOk = !searchQuery ||
                p.title.toLowerCase().includes(searchQuery) ||
                p.description.toLowerCase().includes(searchQuery) ||
                p.category.toLowerCase().includes(searchQuery);
            return catOk && searchOk;
        });

        if (filtered.length === 0) {
            grid.innerHTML = `<div class="empty-state" id="empty-state">
                <i class="fas fa-search"></i>
                <p>Aucune procédure trouvée.</p>
            </div>`;
            return;
        }

        grid.innerHTML = filtered.map(p => {
            const ext = p.filename.split('.').pop().toLowerCase();
            const fileUrl = `procedures/${p.filename}`;
            return `
            <div class="proc-card" data-id="${p.id}">
                <div class="proc-header">
                    <div class="proc-icon ${ext}">
                        <i class="fas fa-file-${ext === 'pdf' ? 'pdf' : 'word'}"></i>
                    </div>
                    <div class="proc-meta">
                        <div class="proc-title" title="${p.title}">${p.title}</div>
                        <div class="proc-info">
                            <span class="proc-cat">${p.category}</span>
                            <span class="proc-size">${p.size}</span>
                            <span class="proc-date">${formatDate(p.date)}</span>
                        </div>
                    </div>
                </div>
                <div class="proc-desc">${p.description}</div>
                <div class="proc-actions">
                    <a href="${fileUrl}" target="_blank" class="proc-btn primary"><i class="fas fa-eye"></i> Ouvrir</a>
                    <a href="${fileUrl}" download class="proc-btn"><i class="fas fa-download"></i> Télécharger</a>
                </div>
            </div>
            `;
        }).join('');
    }

    function formatDate(dateStr) {
        const d = new Date(dateStr);
        return d.toLocaleDateString('fr-FR', {day:'2-digit', month:'short', year:'numeric'});
    }
    </script>
</body>
</html>
